services:
  postgres:
    image: postgres:16-alpine
    container_name: markmind-postgres
    environment:
      POSTGRES_DB: markmind
      POSTGRES_USER: markmind
      POSTGRES_PASSWORD: markmind
    ports:
      - "58002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - markmind_network

  redis:
    image: redis:7-alpine
    container_name: markmind-redis
    command: redis-server --appendonly yes
    ports:
      - "58003:6379"
    volumes:
      - redis_data:/data
    networks:
      - markmind_network

  server:
    build:
      context: ./server
    container_name: markmind-server
    environment:
      SERVER_PORT: 8080
      GIN_MODE: release
      DATABASE_URL: postgres://markmind:markmind@postgres:5432/markmind?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
      JWT_SECRET: change-me-in-production
      FRONTEND_ORIGIN: http://localhost:58000
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      REFRESH_COOKIE_NAME: markmind_refresh_token
      COOKIE_HTTP_ONLY: true
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: Lax
    depends_on:
      - postgres
      - redis
    ports:
      - "58001:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - markmind_network

  web:
    build:
      context: ./web
    container_name: markmind-web
    depends_on:
      - server
    ports:
      - "58000:80"
    networks:
      - markmind_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  markmind_network:
    driver: bridge
