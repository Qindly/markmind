services:
  postgres:
    image: postgres:16-alpine
    container_name: markmind-postgres
    env_file:
      - ./.env.example
    ports:
      - "58002:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - markmind_network

  redis:
    image: redis:7-alpine
    container_name: markmind-redis
    command: redis-server --appendonly yes
    ports:
      - "58003:6379"
    volumes:
      - redis_data:/data
    networks:
      - markmind_network

  server:
    build:
      context: ./server
    container_name: markmind-server
    env_file:
      - ./.env.example
    environment:
      SERVER_PORT: 8080
    depends_on:
      - postgres
      - redis
    ports:
      - "58001:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - markmind_network

  web:
    build:
      context: ./web
    container_name: markmind-web
    depends_on:
      - server
    ports:
      - "58000:80"
    networks:
      - markmind_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  markmind_network:
    driver: bridge
